<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текстура на плоскости</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
           
            <div class="control-group">
                <label>Фоновое изображение</label>
                <div class="file-upload">
                    <input type="file" id="bg-upload" accept="image/*">
                    <span class="upload-btn">Выбрать фон</span>
                </div>
            </div>

            <div class="control-group">
                <label>Изображение текстуры</label>
                <div class="file-upload">
                    <input type="file" id="texture-upload" accept="image/*">
                    <span class="upload-btn">Выбрать текстуру</span>
                </div>
            </div>

            <div class="control-group">
                <label for="opacity-slider">Непрозрачность текстуры: <span id="opacity-val">100%</span></label>
                <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="actions">
                <button id="reset-btn" class="btn secondary">Сбросить плоскость</button>
                <button id="export-btn" class="btn primary">Сохранить результат</button>
            </div>
            
            <div class="instructions">
                <h3>Инструкция:</h3>
                <ol>
                    <li>Загрузите фоновое изображение.</li>
                    <li>Загрузите текстуру.</li>
                    <li>Перетаскивайте 4 угловые точки, чтобы задать плоскость для наложения.</li>
                </ol>
            </div>
        </aside>

        <main class="workspace">
            <div class="canvas-container" id="canvas-wrapper">
                <canvas id="main-canvas"></canvas>
                <div class="no-image-placeholder" id="placeholder">
                    <p>Загрузите изображения для начала работы</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
